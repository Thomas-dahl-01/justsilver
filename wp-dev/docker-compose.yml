# Lokal test-WordPress med WooCommerce og JustSilver-pluginet monteret.
# Start: docker compose up -d   ->  http://localhost:8080  (admin: /wp-admin)
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes: [db:/var/lib/mysql]

  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - ../wp-plugin/justsilver:/var/www/html/wp-content/plugins/justsilver

  cli:
    image: wordpress:cli-php8.3
    depends_on: [db, wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../wp-plugin/justsilver:/var/www/html/wp-content/plugins/justsilver
    entrypoint: ["wp"]
    profiles: [cli]

volumes:
  db:
  wp:
