name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: wp-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Lint PHP
        run: find justsilver tests -name '*.php' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors' || true

      - name: Fail on syntax errors
        run: "! find justsilver tests -name '*.php' -print0 | xargs -0 -n1 php -l 2>&1 | grep -q 'Parse error'"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests
        run: vendor/bin/phpunit

  assets:
    name: JavaScript & translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for f in wp-plugin/justsilver/assets/js/*.js; do node --check "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Danish translation is complete
        run: python wp-plugin/tools/make-da-po.py
